name: Sauvegarde bi-mensuelle du site

on:
  schedule:
    # Se déclenche le 1er et le 15 de chaque mois à 05:00 UTC
    # = minuit heure de l'Est (hiver) / 1h du matin (été, à cause du changement d'heure)
    - cron: '0 5 1,15 * *'
  workflow_dispatch: # permet aussi de lancer la sauvegarde manuellement depuis l'onglet "Actions"

concurrency:
  group: sauvegarde-site
  cancel-in-progress: true # si une nouvelle exécution démarre, l'ancienne (encore en cours) est annulée automatiquement

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # sécurité : la 1ère sauvegarde complète peut prendre 4-4h30, marge portée à 5h30 (max technique GitHub = 6h)
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Définir la date du jour
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour la copie statique du site (téléchargement incrémental)
        run: |
          mkdir -p site
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --no-host-directories \
            --wait=1 \
            --random-wait \
            --tries=2 \
            --timeout=30 \
            --user-agent="Mozilla/5.0 (compatible; SiteBackupBot/1.0)" \
            --include-directories=/fr \
            --reject-regex="(\?|&)(sort|order|tri|page|per_page|dir)=" \
            -P site \
            https://www.associatedartcollectors.com/fr \
          || echo "wget a signalé des erreurs mineures (liens morts, ressources manquantes, etc.) - la sauvegarde se poursuit quand même."
          # Note : --mirror active automatiquement le "timestamping" (-N) : seuls les
          # fichiers modifiés depuis la dernière exécution sont retéléchargés, car le
          # dossier "site/" est conservé d'une exécution à l'autre (contrairement à un
          # dossier daté qui repartirait de zéro à chaque fois).
          # --include-directories=/fr : reste dans la section française, ne suit pas les liens vers /en/.
          # --reject-regex : ignore les URLs de tri/pagination (ex. ?sort=titre, ?page=2), qui
          # dupliquent inutilement le même contenu sous des dizaines/centaines de variantes d'URL.

      - name: Committer, taguer et pousser la sauvegarde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "Aucun changement détecté depuis la dernière sauvegarde."
          else
            git commit -m "Sauvegarde automatique du ${{ steps.date.outputs.today }}"
            git tag "sauvegarde-${{ steps.date.outputs.today }}"
            git push
            git push origin "sauvegarde-${{ steps.date.outputs.today }}"
          fi

      - name: Envoyer un courriel de confirmation
        if: always() # envoie le courriel même si une étape précédente a échoué, pour être informé dans tous les cas
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Sauvegarde du site - ${{ steps.date.outputs.today }} - ${{ job.status }}"
          to: info@associatedartcollectors.com
          from: "Sauvegarde automatique <${{ secrets.MAIL_USERNAME }}>"
          body: |
            La sauvegarde bi-mensuelle du site a été exécutée le ${{ steps.date.outputs.today }}.
            Statut : ${{ job.status }}

            Détails complets disponibles ici :
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
